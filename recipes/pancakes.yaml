title: Pancakes
serves: 4
tags: [breakfast, quick]
ingredients:
  flour: 250 g plain flour
  milk: 500 ml whole milk
  eggs: 2 eggs
  sugar: 1 tbsp sugar
  salt: 1 pinch salt !fixed
  butter: 2 tbsp butter, for frying
equipment:
  - 24 cm frying pan
steps:
  - Whisk {flour}, {sugar} and {salt} with {milk} until smooth.
  - Beat in {eggs} and rest the batter for 20 minutes.
  - Heat the pan over medium heat and fry the pancakes in {butter}, about 1 minute per side.
