title: Chicken & sweet potato cottage pie
serves: 2
tags: [chicken, make-ahead, comfort food]
description: Chicken thighs braised in a thick, glossy gravy with vegetables, under a cheesy sweet potato mash. Two large portions, each about 600 kcal with 50 g protein, 55 g carbs and 20 g fat.
source: Per & Claude
time: About 1½ hours (45 mins hands-on)

ingredients:
  For the filling:
    chicken: 500 g (1.1 lb) boneless skinless chicken thighs, cut into bite-size pieces
    oil: 1 tbsp olive oil
    onion: 1 onion, diced
    carrot: 1 carrot, diced
    celery: 1 celery stalk, diced
    mushrooms: 150 g (5 oz) mushrooms, sliced
    garlic: 3 garlic cloves, minced
    paste: 1 tbsp tomato paste
    flour: 1 tbsp flour
    stock: 400 ml (1 2/3 cups) chicken stock
    worcestershire: 1 tsp Worcestershire sauce
    thyme: 1 tsp dried thyme
    peas: 1 cup frozen peas
    seasoning: Salt and pepper
  For the sweet potato topping:
    potatoes: 2 large sweet potatoes, peeled and cubed
    butter: 1 tbsp butter (about a knob)
    milk: A splash of milk
    seasoning2: Salt and pepper
    cheese: 50 g grated cheddar or parmesan

equipment:
  - Large frying pan or sauté pan
  - Individual oven dishes or foil trays, one per portion

steps:
  - Make the mash. Boil {potatoes} in salted water for about 15 minutes, until a fork slides in easily. Drain well, then mash with {butter}, the milk, salt and pepper. Set aside.
  - Brown the chicken. Heat {oil} in the pan over medium-high heat. Season {chicken} with salt and pepper and sear it in one layer until golden, 5–6 minutes. It doesn't need to be cooked through yet. Move it to a plate.
  - Soften the vegetables. In the same pan, cook {onion}, {carrot}, {celery} and {mushrooms} over medium heat for about 8 minutes, until soft and the mushrooms have released their liquid.
  - Build the gravy base. Add {garlic} and {paste} and stir for 1 minute. Sprinkle in {flour} and stir for another minute so it coats everything.
  - Braise. Pour in {stock} gradually, stirring to lift the browned bits off the bottom of the pan. Add {worcestershire}, {thyme} and the chicken with its juices. Simmer uncovered for 20–25 minutes until the sauce is thick and glossy. If it still looks thin, give it 5 more minutes; a thick filling keeps the mash from sinking. Stir in {peas} and taste for salt and pepper.
  - Assemble. Divide the filling between the oven dishes, one per portion. Spoon the mash on top and spread it to the edges. Rough up the surface with a fork, since the ridges crisp up nicely, then sprinkle on {cheese}.
  - To bake now or later, let it cool, cover and refrigerate. It keeps up to 3 days unbaked.
  - "Oven: 190°C (375°F). Bake covered with foil for 25 minutes, then uncovered for 10–15 minutes until it's bubbling at the edges and golden on top."
  - "Air fryer, if the dish fits: 170°C (340°F) for about 20 minutes. Cover with foil for the first 10 minutes if the top browns too fast."
  - It's done when it's piping hot in the centre, 75°C (165°F).

notes: Baking times are for individual portions straight from the fridge. A single larger dish will need longer; check that the centre reaches 75°C (165°F).
