title: Sweetened condensed milk
makes: 2 cups
tags: [baking, basics]
description: Homemade condensed milk with a richer, fresher dairy flavour than the canned kind. Makes 2 cups (19 oz, 540 g), the exact amount for the butternut pumpkin pie.
source: Stella Parks (BraveTart), Serious Eats
url: https://www.seriouseats.com/bravetart-sweetened-condensed-milk-recipe
time: 45 mins

ingredients:
  milk: 32 oz (4 cups; 910 g) milk, any percentage will do
  cream: 6 oz (3/4 cup; 170 g) heavy cream
  sugar: 7 oz (1 cup; 195 g) plain or toasted sugar @toasted-sugar
  salt: 1/8 tsp Diamond Crystal kosher salt (for table salt, use about half as much by volume or the same weight)
  aromatics: Aromatics such as a split vanilla bean or a cinnamon stick (optional)

equipment:
  - 5-quart stainless steel saucier or Dutch oven !warn
  - Heat-resistant spatula
  - Kitchen scale (optional, but makes it easy)

steps:
  - Combine {milk}, {cream}, {sugar}, {salt} and the vanilla bean or cinnamon (if using) in the saucier. If you have a scale, weigh the pot and ingredients together so you can track the reduction. Place over medium heat, stirring occasionally with the spatula, until the milk begins to simmer, about 12 minutes.
  - Continue simmering an additional 30 minutes, scraping continuously to prevent a milky buildup from forming around the sides. When the thickened milk syrup suddenly turns foamy, it's almost done. Keep cooking and stirring until the foam subsides and the dairy has condensed to exactly [[2 cups]] ([[19 oz]]). If using a scale, the pot will weigh [[26 oz]] less than when you started.
  - "Troubleshooting: should the dairy reduce too far, top it off with enough milk to reach [[2 cups]] ([[19 oz]]), then remove the aromatics and blitz with an immersion blender to emulsify."
  - Pour into an airtight container, seal to prevent evaporation, and refrigerate until needed, up to 1 month. To mimic the consistency of canned milk, bring to room temperature before use.

notes: Timing varies a lot with your stove and pot. If it takes much longer than 12 minutes to come to a simmer, raise the heat to medium-high so the dairy reduces in the allotted time; if it simmers much faster, lower it to medium-low. Keeps in an airtight container in the fridge for up to a month.
