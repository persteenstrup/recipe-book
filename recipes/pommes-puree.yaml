title: Pommes purée (rich and creamy mashed potatoes)
serves: 4
tags: [side, potatoes, vegetarian, thanksgiving]
description: Ultra-smooth, buttery French-style mashed potatoes. Serves 4 to 5, and doubles easily for a crowd.
source: J. Kenji López-Alt, Serious Eats
url: https://www.seriouseats.com/rich-and-creamy-mashed-potatoes-recipe
time: 50 mins

ingredients:
  potatoes: 2 lb (900 g) skin-on Yukon Gold potatoes, scrubbed
  butter: 8 tbsp (1/2 cup; 115 g) unsalted butter, cut into 1-tablespoon pieces
  cream: 1 1/2 cups (355 ml) heavy cream, plus more as needed
  stock: 1/2 cup (120 ml) homemade chicken stock or low-sodium broth, at most (optional)
  seasoning: Kosher salt and freshly ground black pepper

equipment:
  - Ricer or food mill
  - Stand mixer with paddle attachment (optional)

steps:
  - In a large pot, cover {potatoes} with cold water. Bring to a boil over high heat, then reduce to a simmer. Cook until the potatoes are tender and offer no resistance when poked with a paring knife. Drain and let stand until cool enough to handle.
  - Carefully peel the potatoes, transferring them to a large bowl as you go.
  - Pass the potatoes through a ricer or food mill set over the now-empty pot, or into the bowl of a stand mixer fitted with the paddle. (For the absolute smoothest texture, work the potatoes through a drum sieve first; entirely optional.)
  - If using the stand mixer, whip on low speed for 30 seconds, then on high until smooth, about 30 seconds longer. Transfer the potatoes to the pot and add {butter}, {cream} and a generous sprinkling of salt. If skipping the mixer, add the butter, cream and salt to the potatoes in the pot.
  - Bring the cream to a simmer, letting the butter melt completely. Fold in the hot cream and melted butter, stirring well. Season to taste with salt and pepper. For creamier potatoes add more cream, or for more savory ones add up to {stock}, pouring it around the potatoes and bringing to a simmer before folding in. Keep warm until ready to serve.

notes: This recipe can be doubled to serve a larger crowd.
