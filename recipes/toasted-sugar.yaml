title: Toasted sugar
makes: 9 cups
tags: [baking, basics]
description: Granulated caramel that can be used in any recipe as a one-to-one substitute for plain sugar, by weight or volume. Gives desserts a deeper, less cloying sweetness.
source: Stella Parks (BraveTart), Serious Eats
url: https://www.seriouseats.com/dry-toasted-sugar-granulated-caramel-recipe
time: About 4 hrs, mostly hands-off

ingredients:
  sugar: 4 lb (9 cups; 1.8 kg) granulated white sugar (see notes)

equipment:
  - 9- by 13-inch glass or ceramic baking dish !warn
  - Food processor (optional)

steps:
  - Adjust the oven rack to the center position and preheat the oven to 300°F (150°C). Pour {sugar} into the baking dish. Toast until the sugar turns ivory, about 1 hour.
  - Stir thoroughly and continue roasting, pausing to stir every 30 minutes. The sugar will produce steam as a byproduct of toasting, so it must be stirred well to let that moisture escape. Stirring also moves hot sugar from the edges toward the center, and cool sugar from the center toward the edges, for even toasting.
  - Continue toasting and stirring every 30 minutes until the sugar has darkened to the degree you want, from a light beige to the color of traditional brown sugar, between 2 and 4 hours more.
  - When the sugar has finished toasting, set aside and cool to room temperature, stirring from time to time to speed the process and let steam escape. To cool it faster, pour the sugar into a large, heat-safe container. Once fully cool, transfer to an airtight container and store as you would plain white sugar.
  - "Troubleshooting: in an oven that runs hot, with a different amount of sugar, a different size baking dish, or a metal dish, the sugar will heat more quickly and may begin to liquefy much sooner than expected. If this happens, immediately pour the dry sugar into a large stainless steel bowl, leaving the melted caramel behind. If the sugar isn't stirred thoroughly throughout, it may clump badly as it toasts and cools; if so, grind the cooled sugar in a food processor until powdery and fine."

notes: The recipe scales to any size, but given the time involved, larger batches are more worthwhile. Smaller batches in a smaller dish will toast faster, so start checking sooner. Refined cane or beet sugar both work well; organic, raw and semi-refined sugars are more likely to melt early because of their natural fructose content.
