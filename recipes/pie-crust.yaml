title: Buttery, flaky pie crust
makes: 2 pie crusts
tags: [baking, pie, basics]
description: Buttery, flaky, tender and easy pie dough that needs no special equipment, ingredients or training. One batch makes two single crusts or one double-crusted pie.
source: Stella Parks (BraveTart), Serious Eats
url: https://www.seriouseats.com/old-fashioned-flaky-pie-dough-recipe
time: 3 hrs 20 mins (20 mins active, plus chilling; 1 hr more to blind-bake)

ingredients:
  flour: 8 oz (1 2/3 cups; 225 g) low-protein all-purpose flour, such as Gold Medal Blue Label, plus more for dusting
  sugar: 1/2 oz (1 tbsp; 15 g) sugar
  salt: 1 tsp (4 g) Diamond Crystal kosher salt (for table salt, use half as much by volume or the same weight)
  butter: 8 oz (1 cup; 225 g) unsalted American-style butter, cold, straight from the fridge
  water: 4 oz (1/2 cup; 115 g) cold tap water

equipment:
  - Rolling pin
  - 9-inch pie pan, preferably tempered glass !warn
  - Pastry brush

steps:
  - "For the dough: whisk {flour}, {sugar} and {salt} together in a medium bowl. Cut {butter} into cubes no smaller than 1/2 inch, and toss with the flour mixture to break up the pieces. With your fingertips, smash each cube flat. That's it, no rubbing or cutting."
  - Stir in {water}, then knead the dough against the sides of the bowl until it comes together in a shaggy ball. The dough should be between 65°F (18°C) and 70°F (21°C); if not, refrigerate briefly before rolling and folding.
  - "Make the layers: on a generously floured surface, roll the dough into a roughly 10- by 15-inch rectangle. Fold the 10-inch sides to the center, then close the packet like a book. Fold in half once more, bringing the short sides together to make a thick block. Divide in half with a sharp knife or bench scraper; each half makes one crust. The dough should still be between 65°F (18°C) and 70°F (21°C); if not, refrigerate briefly before continuing."
  - "For single-crust pies: using as much flour as needed, roll one piece into a 14-inch circle. This leaves enough overhang for a generous border; at smaller sizes the dough falls short and thicker dough won't crisp. Transfer to a 9-inch pie plate, dust off excess flour with the pastry brush, and use the brush to nestle the dough into the corners of the pan."
  - With scissors or kitchen shears, trim the edge so it overhangs by 1 1/4 inches. Fold the overhang over itself to make a thick border that sits on top of the rim, not below it. Crimp or shape as you like. Repeat with the remaining dough. Wrap in plastic and refrigerate at least 2 hours and up to overnight.
  - "For a double-crust pie: roll and line the pie plate with one piece as above. For a solid top crust, roll the remaining dough the same way; for a lattice top, roll it into a 9- by 15-inch rectangle instead. Transfer it to a baking sheet or parchment-lined board. Wrap both portions in plastic and refrigerate at least 2 hours and up to overnight. After filling the pie and sealing the crusts together, refrigerate 30 minutes before baking."
  - "For a blind-baked crust: adjust the oven rack to the lower-middle position and preheat to 350°F (180°C). Line a crust that has chilled at least 2 hours with a large sheet of aluminum foil, pressing it into the curves of the plate (you may need a second sheet for full coverage). Fill to the brim with sugar, set on a half sheet pan, and bake until fully set and golden around the edges, 60 to 75 minutes."
  - Fold the long sides of the foil toward the middle, gather the short sides, and use both hands to carefully lift the sugar into a heat-safe bowl. Let the sugar cool to room temperature. If needed, bake the crust a few minutes more to brown the bottom.

notes: Tempered glass pie plates conduct heat quickly and evenly, so the crust bakes up light and crisp. When the kitchen is above 74°F (23°C), equipment and pantry staples warm the butter and make the dough sticky, so chill things as needed. The dough keeps in the fridge up to 24 hours; for longer, freeze it as a block, rolled, or shaped in the pan (a frozen block still needs at least 2 hours to rest after rolling and shaping).
