title: Vegetarian shepherd's pie with lentils and mushrooms
serves: 8
tags: [vegetarian, lentils, mushrooms, make-ahead, comfort food]
description: Your favorite mashed potato delivery system, now starring lentils and two kinds of mushrooms in a rich red wine gravy.
source: Leah Colins, Serious Eats
url: https://www.seriouseats.com/vegetarian-shepherds-pie-with-lentils-and-mushrooms-recipe-12236800
time: 1 hr 25 mins (plus 15 mins cooling)

ingredients:
  For the potato topping:
    potatoes: 3 lb (1.36 kg) russet potatoes, peeled and cut into 1-inch pieces
    butter: 6 tbsp (3 oz; 85 g) unsalted butter, cut into cubes
    cream: 1 1/2 cups (360 ml) heavy cream
    cheese: 4 oz (113 g) finely grated Parmigiano-Reggiano, plus more for topping (see notes)
    salt: 1 tsp Diamond Crystal kosher salt, plus more for the potato water (for table salt, use half as much by volume)
  For the filling:
    lentils: 1 1/2 cups (9 oz; 260 g) dried French green or brown lentils, picked over and rinsed
    oil: 2 tbsp (30 ml) olive oil, divided
    onion: 1 large yellow onion (about 10 oz / 285 g each), finely diced
    carrots: 2 medium carrots (about 2 oz / 60 g each), peeled and finely diced
    parsnip: 1 parsnip (about 4 oz / 120 g each), peeled and finely diced
    celery: 1 large celery rib (about 2 1/2 oz / 75 g each), finely diced
    garlic: 2 medium cloves garlic, minced
    cremini: 8 oz (225 g) cremini mushrooms, trimmed and finely chopped
    shiitake: 8 oz (225 g) shiitake mushrooms, stemmed and finely chopped
    paste: 2 tbsp (30 g) tomato paste
    sugar: 2 tbsp (25 g) packed light brown sugar
    thyme: 2 tsp fresh thyme leaves
    bay: 2 fresh bay leaves
    worcestershire: 1 tbsp (15 ml) Worcestershire sauce (see notes)
    marmite: 1 tsp Marmite or soy sauce
    flour: 2 tbsp (16 g) all-purpose flour
    wine: 1 cup (240 ml) dry red wine
    peas: 1 cup (4 3/4 oz; 135 g) frozen peas
    salt2: 2 tsp Diamond Crystal kosher salt (for table salt, use half as much by volume)
    pepper: 1 tsp freshly ground black pepper
    garnish: Finely chopped fresh parsley or thyme leaves, for garnish (optional)

equipment:
  - Dutch oven or large pot
  - Colander
  - Potato masher
  - Medium saucepan
  - 9- by 13-inch baking dish !warn

steps:
  - "For the potato topping: adjust the oven rack to the middle position and preheat the oven to 425°F (220°C). Place {potatoes} in a Dutch oven or large pot and add enough cold water to cover by at least 2 inches. Season generously with salt. Bring to a boil over high heat, then adjust the heat to maintain a simmer. Cook, uncovered, until the potatoes are completely tender, about 15 minutes."
  - Drain well and transfer to a large heatproof bowl; keep the Dutch oven for the filling. Using a potato masher, mash the potatoes with {butter}.
  - In a large microwave-safe bowl or measuring cup, microwave {cream} on high until steaming but not boiling, 1 to 1 1/2 minutes. Add the warm cream, {cheese} and {salt} to the potatoes and gently fold until just incorporated. Cover to keep warm and set aside.
  - "For the filling: while the potatoes cook, place {lentils} in a medium saucepan and cover with cold water by about 2 inches. Bring to a boil over high heat, then reduce to a gentle simmer and cook until the lentils are just tender but still hold their shape, about 20 minutes. Reserve [[1 cup (240 ml)]] of the cooking liquid, then drain and rinse the lentils. Set aside."
  - In the Dutch oven, heat {oil:half} over medium heat until shimmering. Add {onion}, {carrots}, {parsnip} and {celery} and cook, stirring occasionally, until the vegetables begin to soften, about 5 minutes. Add {garlic} and cook, stirring, until fragrant, about 30 seconds. Transfer the vegetables to a medium bowl.
  - Add the remaining {oil:half} to the Dutch oven and heat over medium-high heat until shimmering. Add {cremini} and {shiitake} and cook, stirring occasionally, until the released liquid has evaporated and the mushrooms are deeply browned, 8 to 10 minutes. Return the onion mixture to the pot.
  - Add {paste} and cook, stirring, until slightly darkened, 1 minute. Stir in {sugar}, {thyme}, {bay}, {worcestershire} and {marmite}. Sprinkle {flour} over the vegetables and cook, stirring, until no dry flour remains, 1 to 3 minutes. Add {wine} and bring to a simmer, scraping the bottom of the pot to release any browned bits. Cook until the wine is reduced by about half and the mixture has thickened, 2 to 3 minutes.
  - Stir in the lentils and {peas} and cook until the peas are bright green and heated through, about 2 minutes. Remove from the heat and discard the bay leaves. Stir in the reserved lentil cooking liquid, {salt2} and {pepper}.
  - "To assemble and bake: transfer the filling to the baking dish and spread in an even layer. Spoon the potato topping over the filling and gently spread to the edges. Using a fork or spatula, rough up the surface to create ridges and peaks. Sprinkle with more cheese."
  - Bake until the filling is bubbling around the edges and the topping is golden, 20 to 25 minutes. For deeper browning, turn on the broiler and broil, watching closely, until well browned, about 3 minutes. Let rest for 15 to 20 minutes. Garnish with parsley or thyme, if using, and serve.

notes: Parmigiano-Reggiano and conventional Worcestershire sauce contain animal rennet and anchovies; for a fully vegetarian dish, use a Parmesan-style cheese made with vegetarian rennet and a vegetarian Worcestershire sauce. The pie can be assembled through the assembly step, covered and refrigerated up to 1 day; bake straight from the fridge, allowing extra time. The assembled, unbaked pie can be frozen up to 2 months; thaw overnight in the fridge before baking. Leftovers keep 4 days in the fridge; reheat portions in the microwave, or the whole pie covered with foil in a 350°F (175°C) oven.
