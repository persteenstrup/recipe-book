title: Butternut pumpkin pie
serves: 12
tags: [baking, sweet, pie, thanksgiving]
description: The very best pumpkin pie is made from squash, which is what's actually inside those cans of "pure pumpkin purée". Made with homemade condensed milk.
source: Stella Parks (BraveTart), Serious Eats
url: https://www.seriouseats.com/bravetart-butternut-pumpkin-pie-recipe
time: 3 hrs 55 mins (20 mins active, plus 2 hrs cooling)

ingredients:
  For the squash purée:
    squash: 1 butternut squash, about 7 inches long (about 680 g each)
  For the custard:
    puree: 14 oz (1 3/4 cups; 395 g) roasted butternut squash purée
    condensed: 19 oz (2 cups; 540 g) sweetened condensed milk, homemade @sweetened-condensed-milk
    sugar: 4 oz (1/2 cup; 115 g) light brown sugar, firmly packed
    vanilla: 1 tbsp (15 g) vanilla extract or bourbon
    ginger: 1 1/2 tsp ground ginger
    cinnamon: 1 1/2 tsp ground cinnamon
    nutmeg: 1/4 tsp freshly grated nutmeg, plus more to garnish if desired
    salt: 1/4 tsp (1 g) Diamond Crystal kosher salt (for table salt, use about half as much by volume or the same weight)
    cloves: 1/8 tsp ground cloves
    butter: 1 oz (2 tbsp; 30 g) unsalted butter, melted and warm
    eggs: 3 large eggs, straight from the fridge
  For the crust:
    crust: 1/2 recipe old-fashioned flaky pie dough, blind-baked

equipment:
  - 9-inch pie pan, preferably glass !warn
  - Half sheet pan
  - Food processor

steps:
  - "For the squash purée: adjust the oven rack to the lower-middle position and preheat to 400°F (200°C). Split {squash} lengthwise, remove the seeds, and place cut-side down on a foil-lined baking sheet. Roast until fork-tender, about 45 minutes."
  - When cool enough to handle, scrape the pulp into a food processor and purée until smooth. Measure out {puree}. Use warm, or refrigerate in an airtight container up to a week in advance.
  - "For the custard: adjust the oven rack to the lower-middle position and preheat to 375°F (190°C). In a medium bowl, combine {puree}, {condensed}, {sugar}, {vanilla}, {ginger}, {cinnamon}, {nutmeg}, {salt}, {cloves}, {butter} and {eggs}. Whisk until well combined, then pour into the prepared crust. The custard can also be refrigerated for up to a week before use."
  - "To bake: place on a half sheet pan and bake about 25 minutes, then reduce the oven temperature to 350°F (175°C) and continue baking until the filling is firm around the edges but still wobbly in the very center, about 25 minutes more, or to an internal temperature of 200°F (93°C)."
  - Cool at room temperature until the custard has set, about 2 hours, and cut with a chef's knife to serve. If you like, serve with a dollop of whipped cream and a sprinkling of grated nutmeg.

notes: Butternut has the highest yield, but any squash works (kabocha, buttercup, acorn) as long as the total weight of purée stays the same. Wrapped in plastic, leftovers keep 4 days at room temperature or 10 days in the fridge.
