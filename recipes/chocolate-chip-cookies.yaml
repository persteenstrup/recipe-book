title: Chocolate chip cookies
makes: 24
tags: [baking, sweet]
source: US-style recipe (cups)
ingredients:
  butter: 1 cup unsalted butter, softened
  sugar: 3/4 cup granulated sugar
  brown: 3/4 cup packed brown sugar
  eggs: 2 eggs
  vanilla: 1 tsp vanilla extract
  flour: 2 1/4 cup all-purpose flour
  soda: 1 tsp baking soda
  salt: 1/2 tsp salt
  chips: 2 cup chocolate chips
steps:
  - Heat the oven to 375 °F and line two baking sheets.
  - Cream {butter} with {sugar} and {brown} until fluffy. Beat in {eggs} and {vanilla}.
  - Whisk {flour}, {soda} and {salt}, then mix into the butter.
  - Stir in {chips}. Scoop tablespoon-sized balls onto the sheets.
  - Bake 9 to 11 minutes until golden at the edges.
