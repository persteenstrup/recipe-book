title: The ultimate homemade green bean casserole
serves: 8
tags: [side, thanksgiving, make-ahead]
description: The classic Thanksgiving green bean casserole, upgraded with fresh beans, freshly fried shallots and a homemade mushroom sauce. Serves 8 to 12.
source: J. Kenji López-Alt, Serious Eats
url: https://www.seriouseats.com/homemade-green-bean-casserole-recipe
time: 1 hr 40 mins

ingredients:
  For the fried shallots:
    shallots: 1 lb (450 g) shallots, peeled and sliced 1/8 inch thick on a mandoline
    oil: 2 cups (480 ml) canola oil
    salt: Kosher salt
  For the mushroom sauce:
    mushrooms: 1 1/2 lb (675 g) white button mushrooms, rinsed and spun dry in a salad spinner
    soy: 2 tsp (10 ml) soy sauce
    lemon: 2 tsp (10 ml) lemon juice, from 1 lemon
    stock: 2 cups (480 ml) low-sodium store-bought or homemade chicken stock
    cream: 1 1/2 cups (360 ml) heavy cream
    butter: 2 tbsp (30 g) butter
    garlic: 2 cloves garlic, finely minced or grated on a Microplane
    flour: 1/4 cup (30 g) flour
    pepper: Freshly ground black pepper
  For the beans:
    beans: 2 lb (900 g) green beans, ends trimmed, cut into 2-inch segments

equipment:
  - Wok or nonstick saucepan
  - Mandoline
  - Rimmed baking sheet
  - Fine-mesh strainer
  - 12-inch nonstick skillet
  - Colander
  - 9- by 13-inch baking dish !warn

steps:
  - Combine {shallots} and {oil} in a wok or medium nonstick saucepan. The shallots should barely stick out above the oil. Place over high heat and cook, stirring frequently, until the shallots are completely soft, about 12 minutes.
  - Meanwhile, line a rimmed baking sheet with 6 layers of paper towels. Continue to cook the shallots, stirring constantly, until light golden brown, about 8 minutes.
  - Immediately strain through a fine-mesh strainer set over a heatproof bowl or saucepan. Set the shallot oil aside. You should have about [[2 cups]] of fried shallots.
  - Transfer the fried shallots to the paper towels. Lift one end of the top towel and roll the shallots off onto the second. Blot with the first towel to absorb excess oil. Repeat 4 more times, moving the shallots from one towel to the next, until only one towel remains. Season well with salt.
  - Let the shallots cool completely, about 45 minutes, then transfer to an airtight container. They can be made up to 1 month in advance.
  - Smash {mushrooms} under the bottom of a large skillet until broken into 1/4 to 1/2 inch pieces. Roughly chop into pieces about 1/8 to 1/4 inch in size. Set aside.
  - Combine {soy}, {lemon}, {stock} and {cream} in a 1-quart liquid measuring cup or medium bowl.
  - Add [[2 tbsp (30 ml)]] of the reserved shallot oil and {butter} to the 12-inch skillet (save the remaining oil in an airtight container for another use). Heat over high heat until the butter is melted and the foaming subsides. Add the mushrooms and cook, stirring occasionally, until the liquid has evaporated and the mushrooms begin to sizzle, 6 to 10 minutes.
  - Reduce the heat to medium-high. Add {garlic} and cook, stirring constantly, until fragrant, about 30 seconds. Add {flour} and cook, stirring constantly, until light golden blond, 1 to 2 minutes. Whisking constantly, add the stock and cream mixture.
  - Bring to a boil, reduce to a simmer, and cook until the mixture is somewhere between pancake batter and heavy cream in texture, about 5 minutes. Season to taste with salt and pepper.
  - Adjust the oven rack to the lower-middle position and preheat the oven to 350°F (180°C). Bring [[1 gallon (3.8 l)]] water and [[1/4 cup (48 g)]] kosher salt to a boil over high heat. Fill a large bowl with [[1 quart]] ice cubes and [[2 quarts (1.9 l)]] water.
  - Add {beans} to the boiling water and cook until tender but still bright green, about 5 minutes. Drain in a colander and immediately transfer to the ice water until completely cooled. Drain and set aside.
  - Combine the green beans, mushroom sauce and [[1 cup]] of the fried shallots. Transfer to the baking dish (or a 10- by 14-inch oval dish). Bake until hot and bubbly, 15 to 20 minutes. Top with the remaining [[1 cup]] fried shallots and serve.

notes: You can use store-bought fried onions or shallots instead of making your own (look in Thai or Vietnamese markets for the best ones). Slice the shallots on a plastic mandoline for even results. The frying oil keeps in an airtight container away from light for up to 3 months; use it for stir-fries or dressings. To halve the recipe, use a 10-inch skillet in place of the baking dish. The fried shallots keep 1 month, the mushroom sauce up to 4 days in the fridge, and the assembled casserole up to 2 days; to finish, cover with foil and heat in a 350°F (180°C) oven until hot, about 30 minutes, then uncover and cook until bubbly, about 10 minutes more. Top with a cup of fried shallots and serve.
