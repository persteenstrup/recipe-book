title: No-waste tacos de carnitas with salsa verde
serves: 4
tags: [mexican, pork, tacos]
description: Oven-braised carnitas that stay juicy with plenty of crispy bits, and a salsa verde simmered in the leftover cooking liquid. Serves 4 to 6.
source: J. Kenji López-Alt, Serious Eats
url: https://www.seriouseats.com/no-waste-tacos-de-carnitas-with-salsa-verde-recipe
time: 4 hrs 35 mins (25 mins active)

ingredients:
  For the carnitas:
    onions: 2 medium onions, divided
    cilantro: 1/2 cup (8 g) chopped fresh cilantro leaves and tender stems
    pork: 3 lb boneless pork shoulder, cut into 2-inch cubes
    salt: 1 tbsp (8 g) kosher salt, plus more to taste (for table salt, use half the volume)
    orange: 1 medium orange
    garlic: 6 cloves garlic, halved, divided
    bay: 2 bay leaves
    cinnamon: 1 cinnamon stick, broken into 3 or 4 pieces
    oil: 1/4 cup (60 ml) vegetable oil
  For the salsa verde:
    tomatillos: 6 medium tomatillos, husks removed and halved
    jalapenos: 2 jalapeño peppers, stem removed and halved lengthwise
  To serve:
    tortillas: 24 corn tortillas
    queso: 1 cup (150 g) crumbled queso fresco
    limes: 3 limes, cut into wedges

equipment:
  - 9- by 13-inch glass baking dish !warn
  - Large fine-mesh strainer
  - Medium saucepan
  - Fat separator (optional)
  - Immersion or countertop blender

steps:
  - Adjust oven rack to middle position and preheat oven to 275°F (135°C). Cut {onions:half} into fine dice and combine with {cilantro}. Refrigerate until needed. Split the remaining onion into quarters and set aside.
  - Season {pork} with {salt} and place in the baking dish. The pork should fill the dish with no extra space. Split {orange} into quarters and squeeze the juice over the pork. Nestle the squeezed orange pieces into the dish.
  - Add half of the onion quarters, {garlic:twothirds}, {bay} and {cinnamon} to the dish. Nestle everything into an even layer. Pour {oil} over the surface. Cover the dish tightly with aluminum foil and place in the oven. Cook until the pork is fork tender, about 3 1/2 hours.
  - Set the strainer over a 1-quart liquid measuring cup or bowl. Using tongs, remove and discard the orange peel, onion, garlic, cinnamon stick and bay leaves. Transfer the pork, rendered fat and cooking liquid to the strainer and let drain for 10 minutes.
  - Transfer the pork back to the baking dish. You should end up with about 1/2 cup cooking liquid and 1/2 cup fat. Using a flat spoon or fat separator, skim the fat from the surface and add it back to the pork. Shred the pork into large chunks with your fingers or two forks. Season to taste with salt. Refrigerate until ready to serve. Transfer the remaining cooking liquid to the saucepan.
  - Add {tomatillos}, the remaining onion quarters, the remaining {garlic:third} and {jalapenos} to the saucepan with the strained pork liquid. Add water until it is about 1 inch below the top of the vegetables. Bring to a boil over high heat, reduce to a simmer, and cook until all the vegetables are completely tender, about 10 minutes.
  - Blend the salsa with an immersion blender or in a countertop blender until smooth. Season to taste with salt. Allow to cool and refrigerate until ready to use.
  - To serve, preheat the broiler to high with an oven rack 4 inches below the heating element. Broil the pork until brown and crisp on the surface, about 6 minutes. Remove the pork, stir with a spoon to expose new bits to the heat, and broil again until crisp, 6 more minutes. Tent with foil to keep warm.
  - Meanwhile, heat the {tortillas}. Preheat an 8-inch cast iron skillet over medium-high heat until hot. Working one tortilla at a time, dip it in a bowl of water, transfer to the hot skillet and cook until the water evaporates from the first side and the tortilla is browned in spots, about 30 seconds. Flip and cook until dry, about 15 seconds longer. Transfer to a tortilla warmer or wrap in a clean dish towel. Repeat with the remaining tortillas.
  - To eat, stack two tortillas on top of each other. Add 2 to 3 tablespoons of the carnitas to the center. Top with salsa verde, the chopped onion and cilantro, and {queso}. Serve with {limes}.

notes: The carnitas can be prepared through the salsa step up to three days in advance; the pork can be crisped straight from the fridge. For a milder salsa, remove the seeds from the jalapeños or leave them out before simmering.
